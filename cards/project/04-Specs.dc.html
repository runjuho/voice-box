<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스펙</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; background: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #0A84FF; } a:hover { color: #409CFF; }
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 72px; display: flex; flex-direction: column; gap: 36px; background: #000000; color: #F5F5F7;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <span style="width: 14px; height: 14px; border-radius: 50%; background: {{accent}};"></span>
    <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.18em;">RUNJUHO</span>
    <span style="flex-grow: 1;"></span>
    <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.14em; color: #86868B;">04 / 09</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <span style="font-size: 24px; font-weight: 700; letter-spacing: 0.08em; color: {{accent}};">adidas 공식 발표 기준</span>
    <h2 style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif; font-size: 82px; line-height: 1.02; letter-spacing: -0.02em;">스펙</h2>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;">

      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: #86868B;">힐 스택</span>

    </div>

    <div style="background: rgba(255,255,255,0.06); border-radius: 20px; padding: 30px 32px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: #86868B;">포어풋 스택</span>
      <span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif; font-size: 66px; line-height: 1;">35<span style="font-size: 30px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', sans-serif; font-weight: 700; color: #86868B;">&nbsp;mm</span></span>
    </div>

    <div style="background: rgba(255,255,255,0.06); border-radius: 20px; padding: 30px 32px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: #86868B;">드롭</span>
      <span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif; font-size: 66px; line-height: 1;">4<span style="font-size: 30px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', sans-serif; font-weight: 700; color: #86868B;">&nbsp;mm</span></span>
    </div>

    <div style="background: rgba(255,255,255,0.06); border-radius: 20px; padding: 30px 32px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: #86868B;">무게(남성)</span>
      <span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif; font-size: 66px; line-height: 1;">177<span style="font-size: 30px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', sans-serif; font-weight: 700; color: #86868B;">&nbsp;g</span></span>
      <span style="font-size: 19px; font-weight: 700; color: #86868B;">270mm 기준 · 여성 150g(240mm)</span>
    </div>

  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; gap: 24px; align-items: baseline; border-top: 1px solid rgba(245,245,247,0.14); padding-top: 20px;">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: #86868B; min-width: 126px;">미드솔</span>
      <span style="font-size: 30px; font-weight: 900; line-height: 1.35;">라이트스트라이크 프로 2중 레이어</span>
    </div>

    <div style="display: flex; gap: 24px; align-items: baseline; border-top: 1px solid rgba(245,245,247,0.14); padding-top: 20px;">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: #86868B; min-width: 126px;">구조</span>
      <span style="font-size: 30px; font-weight: 900; line-height: 1.35;">카본 에너지림 (신규)<br><span style="font-size: 25px; font-weight: 500; color: #86868B;">막대형 에너지로드를 대체 · 발밑 폼 부피를 늘리면서 강성은 유지</span></span>
    </div>

    <div style="display: flex; gap: 24px; align-items: baseline; border-top: 1px solid rgba(245,245,247,0.14); padding-top: 20px;">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: #86868B; min-width: 126px;">아웃솔</span>
      <span style="font-size: 30px; font-weight: 900; line-height: 1.35;">라이트트랙션 · 컨티넨탈 고무</span>
    </div>

  </div>

  <div style="display: flex; align-items: center; border-top: 1px solid rgba(245,245,247,0.14); padding-top: 24px;">
    <span style="font-size: 21px; font-weight: 700; color: #86868B;">@runjuho</span>
    <span style="flex-grow: 1;"></span>
    <span style="font-size: 21px; font-weight: 500; color: #86868B;">adidas 공식 보도자료(국내 배포) 기준</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0A84FF","options":["#0A84FF","#5E5CE6","#64D2FF","#F5F5F7"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0A84FF' };
  }
}
</script>
</body>
</html>
